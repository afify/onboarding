<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Admin Panel | PayTabs Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/activity-feed.css">
  <link rel="stylesheet" href="/css/hacker-console.css">
  <script type="module" src="/js/app-admin.js"></script>
  <style>
    :root {
      --gradient-start: #0f0c29;
      --gradient-mid: #302b63;
      --gradient-end: #24243e;
      --accent-cyan: #00d4ff;
      --accent-violet: #7c3aed;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-bg-hover: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Instrument Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 50%, var(--gradient-end) 100%);
      background-attachment: fixed;
      color: white;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      grid-template-rows: 64px 1fr;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .admin-main {
      padding: 2rem;
      max-width: 1200px;
    }

    /* Header */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      background: var(--glass-bg-hover);
      color: white;
    }

    .admin-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .admin-subtitle {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 0.25rem;
    }

    .admin-badge {
      padding: 0.375rem 0.75rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.2s ease;
    }

    .stat-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .stat-icon.cyan { background: rgba(0, 212, 255, 0.15); color: var(--accent-cyan); }
    .stat-icon.violet { background: rgba(124, 58, 237, 0.15); color: var(--accent-violet); }
    .stat-icon.green { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .stat-icon.yellow { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Section */
    .section {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.5rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      border: none;
      border-radius: 8px;
      color: white;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-add:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
    }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    .data-table th {
      text-align: left;
      padding: 0.75rem 1rem;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.4);
      border-bottom: 1px solid var(--glass-border);
    }

    .data-table td {
      padding: 1rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--glass-border);
      vertical-align: middle;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover td {
      background: var(--glass-bg);
    }

    .user-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-weight: 600;
    }

    .user-email {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .role-badge {
      padding: 0.25rem 0.625rem;
      border-radius: 4px;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .role-badge.admin {
      background: rgba(0, 212, 255, 0.15);
      color: var(--accent-cyan);
    }

    .role-badge.mentor {
      background: rgba(124, 58, 237, 0.15);
      color: var(--accent-violet);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: var(--glass-bg-hover);
      color: white;
    }

    .btn-icon.danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: linear-gradient(135deg, var(--gradient-mid), var(--gradient-end));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: var(--glass-bg-hover);
      color: white;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: white;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.08);
    }

    .form-select option {
      background: var(--gradient-mid);
      color: white;
    }

    .form-help {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 0.5rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn-secondary {
      flex: 1;
      padding: 0.875rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.8);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--glass-bg-hover);
    }

    .btn-primary {
      flex: 1;
      padding: 0.875rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      border: none;
      border-radius: 10px;
      color: white;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
    }

    .btn-danger {
      flex: 1;
      padding: 0.875rem;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #f87171;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    /* Alert */
    .alert {
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body>
  <div class="admin-layout" x-data="adminPanel()" x-cloak>
    <!-- Main Content -->
    <div class="admin-main">
    <!-- Alert -->
    <div class="alert" :class="alert.type" x-show="alert.show" x-cloak x-transition>
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path x-show="alert.type === 'success'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        <path x-show="alert.type === 'error'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
      <span x-text="alert.message"></span>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon violet">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </div>
        <div class="stat-value" x-text="mentors.length">0</div>
        <div class="stat-label">Mentors</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon cyan">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <div class="stat-value" x-text="mentors.filter(m => m.role === 'admin').length">0</div>
        <div class="stat-label">Admins</div>
      </div>
    </div>

    <!-- Mentors -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Mentors</h2>
        <button class="btn-add" @click="showAddMentorModal = true">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          Add Mentor
        </button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Mentor</th>
            <th>Role</th>
            <th>Trainees</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="mentor in mentors" :key="mentor.id">
            <tr>
              <td>
                <div class="user-cell">
                  <div class="user-avatar" x-text="getInitials(mentor.name)"></div>
                  <div class="user-info">
                    <span class="user-name" x-text="mentor.name"></span>
                    <span class="user-email" x-text="mentor.email"></span>
                  </div>
                </div>
              </td>
              <td>
                <span class="role-badge" :class="mentor.role" x-text="mentor.role"></span>
              </td>
              <td x-text="getMentorTraineeCount(mentor.id)"></td>
              <td x-text="formatDate(mentor.created_at)"></td>
              <td>
                <div class="actions">
                  <button class="btn-icon" @click="editMentor(mentor)" title="Edit">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                  </button>
                  <button class="btn-icon danger" @click="confirmDeleteMentor(mentor)" title="Delete" x-show="mentor.role !== 'admin'">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Add Mentor Modal -->
    <div class="modal-overlay" x-show="showAddMentorModal" x-cloak @click.self="showAddMentorModal = false">
      <div class="modal-content" @click.stop>
        <div class="modal-header">
          <h2 class="modal-title">Add New Mentor</h2>
          <button class="modal-close" @click="showAddMentorModal = false">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <form @submit.prevent="addMentor">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" x-model="newMentor.name" required placeholder="Enter mentor name">
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" x-model="newMentor.email" required placeholder="mentor@paytabs.com">
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" x-model="newMentor.password" required placeholder="Minimum 6 characters" minlength="6">
            <p class="form-help">The mentor will use this to sign in</p>
          </div>

          <div class="form-group">
            <label class="form-label">Role</label>
            <select class="form-select" x-model="newMentor.role">
              <option value="mentor">Mentor</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" @click="showAddMentorModal = false">Cancel</button>
            <button type="submit" class="btn-primary">Create Mentor</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Edit Mentor Modal -->
    <div class="modal-overlay" x-show="showEditMentorModal" x-cloak @click.self="showEditMentorModal = false">
      <div class="modal-content" @click.stop>
        <div class="modal-header">
          <h2 class="modal-title">Edit Mentor</h2>
          <button class="modal-close" @click="showEditMentorModal = false">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <form @submit.prevent="saveMentor" x-show="editingMentor">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" x-model="editingMentor.name" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" :value="editingMentor?.email" disabled>
            <p class="form-help">Email cannot be changed</p>
          </div>

          <div class="form-group">
            <label class="form-label">Role</label>
            <select class="form-select" x-model="editingMentor.role">
              <option value="mentor">Mentor</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" @click="showEditMentorModal = false">Cancel</button>
            <button type="submit" class="btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Edit Trainee Modal -->
    <div class="modal-overlay" x-show="showEditTraineeModal" x-cloak @click.self="showEditTraineeModal = false">
      <div class="modal-content" @click.stop>
        <div class="modal-header">
          <h2 class="modal-title">Edit Trainee</h2>
          <button class="modal-close" @click="showEditTraineeModal = false">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <form @submit.prevent="saveTrainee" x-show="editingTrainee">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" x-model="editingTrainee.name" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" x-model="editingTrainee.email">
          </div>

          <div class="form-group">
            <label class="form-label">Assigned Mentor</label>
            <select class="form-select" x-model="editingTrainee.assigned_mentor_id">
              <option value="">Unassigned</option>
              <template x-for="mentor in mentors" :key="mentor.id">
                <option :value="mentor.id" x-text="mentor.name"></option>
              </template>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-input" x-model="editingTrainee.start_date">
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" @click="showEditTraineeModal = false">Cancel</button>
            <button type="submit" class="btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" x-show="showDeleteModal" x-cloak @click.self="showDeleteModal = false">
      <div class="modal-content" @click.stop>
        <div class="modal-header">
          <h2 class="modal-title">Confirm Delete</h2>
          <button class="modal-close" @click="showDeleteModal = false">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <p style="color: rgba(255,255,255,0.7); margin-bottom: 1.5rem;">
          Are you sure you want to delete <strong x-text="deleteTarget?.name"></strong>?
          This action cannot be undone.
        </p>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" @click="showDeleteModal = false">Cancel</button>
          <button type="button" class="btn-danger" @click="executeDelete">Delete</button>
        </div>
      </div>
    </div>
    </div><!-- end admin-main -->
  </div>

</body>
</html>
