<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>PayTabs Onboarding Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/hacker-console.css">
  <script type="module" src="/js/app-login.js"></script>
</head>
<body class="login-page">
  <!-- Background effects -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>

  <!-- Login Card -->
  <div class="login-card" x-data="{ email: '', password: '', loading: false, error: null }">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">PT</div>
        <span class="brand-name">PayTabs</span>
      </div>
      <p class="brand-tagline">Onboarding Tracker</p>
    </div>

    <!-- Error Message -->
    <div class="error-message" x-show="error" x-cloak x-transition>
      <svg class="error-icon" fill="none" stroke="#ef4444" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span class="error-text" x-text="error"></span>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input
          type="email"
          id="login-email"
          class="form-input"
          placeholder="name@paytabs.com"
          x-model="email"
          required
          :disabled="loading"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          class="form-input"
          placeholder="Enter your password"
          x-model="password"
          required
          :disabled="loading"
        >
      </div>

      <button type="submit" class="submit-btn" :disabled="loading">
        <span x-show="loading" class="spinner"></span>
        <span x-text="loading ? 'Signing in...' : 'Sign In'"></span>
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      Mentor Access Only &middot; <span>v1.0</span>
    </div>
  </div>
</body>
</html>
