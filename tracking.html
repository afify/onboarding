<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Task Tracking | PayTabs Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/activity-feed.css">
  <link rel="stylesheet" href="/css/hacker-console.css">
  <script type="module" src="/js/app-tracking.js"></script>
  <style>
    :root {
      --gradient-start: #0f0c29;
      --gradient-mid: #302b63;
      --gradient-end: #24243e;
      --accent-cyan: #00d4ff;
      --accent-violet: #7c3aed;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-bg-hover: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.15);
      --status-pending: #6b7280;
      --status-progress: #f59e0b;
      --status-done: #10b981;
      --status-blocked: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Instrument Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 50%, var(--gradient-end) 100%);
      background-attachment: fixed;
      color: white;
      overflow-x: hidden;
    }

    /* Subtle grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 240px 1fr 320px;
      grid-template-rows: 64px 1fr;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* Main Content */
    .main-content {
      padding: 1.5rem;
      overflow-y: auto;
      position: relative;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .content-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Summary Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-icon.total {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
    }

    .stat-icon.completed {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }

    .stat-icon.in-progress {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
    }

    .stat-icon.blocked {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
    }

    .stat-data {
      flex: 1;
    }

    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Filters */
    .filters-section {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .filter-label {
      font-size: 0.6875rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .filter-select {
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: white;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.8125rem;
      outline: none;
      cursor: pointer;
      min-width: 140px;
      transition: all 0.2s ease;
    }

    .filter-select:focus {
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.08);
    }

    .filter-select option {
      background: var(--gradient-mid);
      color: white;
    }

    .filter-reset {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-left: auto;
    }

    .filter-reset:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    /* Tasks Table */
    .tasks-table-container {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
    }

    .tasks-table {
      width: 100%;
      border-collapse: collapse;
    }

    .tasks-table th {
      padding: 1rem 1.25rem;
      text-align: left;
      font-size: 0.6875rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--glass-border);
    }

    .tasks-table td {
      padding: 1rem 1.25rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--glass-border);
      vertical-align: middle;
    }

    .tasks-table tr:last-child td {
      border-bottom: none;
    }

    .tasks-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .trainee-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .trainee-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .trainee-name {
      font-weight: 500;
    }

    .week-badge {
      padding: 0.25rem 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .task-title {
      font-weight: 500;
    }

    .task-category {
      font-size: 0.6875rem;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.25rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .updated-info {
      font-size: 0.8125rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .mentor-name {
      color: var(--accent-cyan);
    }

    .date-cell {
      font-size: 0.8125rem;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Space Mono', monospace;
    }

    .date-cell.overdue {
      color: #f87171;
    }

    .date-cell.due-soon {
      color: #fbbf24;
    }

    .btn-edit {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-edit:hover {
      background: var(--glass-bg-hover);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    .score-cell {
      font-family: 'Space Mono', monospace;
      font-size: 0.8125rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .score-cell.has-score {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .score-cell.na {
      font-size: 0.6875rem;
      color: rgba(255, 255, 255, 0.25);
    }

    .score-input {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .score-range {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    .score-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 212, 255, 0.3);
    }

    .score-range::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      cursor: pointer;
      border: none;
    }

    .score-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-cyan);
      min-width: 48px;
      text-align: center;
    }

    .status-select {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .status-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid var(--glass-border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.8125rem;
    }

    .status-option:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .status-option.selected {
      border-color: var(--accent-cyan);
      background: rgba(0, 212, 255, 0.1);
    }

    .status-option input[type="radio"] {
      display: none;
    }

    .score-section {
      margin-bottom: 1.25rem;
      padding: 1rem;
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.1);
      border-radius: 10px;
    }

    .score-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: linear-gradient(135deg, var(--gradient-mid), var(--gradient-end));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--glass-bg-hover);
      color: white;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: white;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.875rem;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.08);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-info {
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      margin-bottom: 1.25rem;
    }

    .form-info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8125rem;
      padding: 0.25rem 0;
    }

    .form-info-label {
      color: rgba(255, 255, 255, 0.5);
    }

    .form-info-value {
      color: rgba(255, 255, 255, 0.9);
      font-family: 'Space Mono', monospace;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn-secondary {
      flex: 1;
      padding: 0.875rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.8);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: var(--glass-bg-hover);
    }

    .btn-primary {
      flex: 1;
      padding: 0.875rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      border: none;
      border-radius: 10px;
      color: white;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      opacity: 0.3;
    }

    .empty-text {
      font-size: 0.875rem;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Responsive */
    @media (max-width: 1400px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .filters-section {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-reset {
        margin-left: 0;
        margin-top: 0.5rem;
      }
    }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body>
  <div class="app-layout" x-data="tracking()" x-cloak>
    <!-- Main Content -->
    <main class="main-content">
      <!-- Content Header -->
      <div class="content-header">
        <h1 class="content-title">Task Tracking</h1>
      </div>

      <!-- Summary Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon total">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
          </div>
          <div class="stat-data">
            <div class="stat-value" x-text="getTotalTasksCount()">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon completed">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <div class="stat-data">
            <div class="stat-value" x-text="getStatusCount('done')">0</div>
            <div class="stat-label">Completed</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon in-progress">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <div class="stat-data">
            <div class="stat-value" x-text="getStatusCount('in_progress')">0</div>
            <div class="stat-label">In Progress</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon blocked">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </div>
          <div class="stat-data">
            <div class="stat-value" x-text="getStatusCount('blocked')">0</div>
            <div class="stat-label">Blocked</div>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters-section">
        <div class="filter-group">
          <label class="filter-label">Trainee</label>
          <select class="filter-select" x-model="filters.trainee">
            <option value="">All Trainees</option>
            <template x-for="trainee in trainees" :key="trainee.id">
              <option :value="trainee.id" x-text="trainee.name"></option>
            </template>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Week</label>
          <select class="filter-select" x-model="filters.week">
            <option value="">All Weeks</option>
            <template x-for="week in weeks" :key="week.id">
              <option :value="week.id" x-text="'Week ' + week.week_number"></option>
            </template>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Status</label>
          <select class="filter-select" x-model="filters.status">
            <option value="">All Statuses</option>
            <template x-for="status in statuses" :key="status.id">
              <option :value="status.id" x-text="status.label"></option>
            </template>
          </select>
        </div>

        <button class="filter-reset" @click="resetFilters" x-show="filters.trainee || filters.week || filters.status">
          Reset Filters
        </button>
      </div>

      <!-- Tasks Table -->
      <div class="tasks-table-container">
        <table class="tasks-table">
          <thead>
            <tr>
              <th>Trainee</th>
              <th>Week</th>
              <th>Task</th>
              <th>Start Date</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Score</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in getFilteredTasks()" :key="item.trainee.id + '-' + item.task.id">
              <tr>
                <td>
                  <div class="trainee-cell">
                    <div class="trainee-avatar" x-text="getInitials(item.trainee.name)"></div>
                    <span class="trainee-name" x-text="item.trainee.name"></span>
                  </div>
                </td>
                <td>
                  <span class="week-badge" x-text="'Week ' + item.weekNumber"></span>
                </td>
                <td>
                  <div class="task-title" x-text="item.task.title"></div>
                  <div class="task-category" :style="'color: ' + getCategory(item.task.category_id).color" x-text="getCategory(item.task.category_id).label"></div>
                </td>
                <td>
                  <span class="date-cell" :class="{ 'overdue': isOverdue(item) }" x-text="item.startDate || '-'"></span>
                </td>
                <td>
                  <span class="date-cell" :class="{ 'overdue': isOverdue(item), 'due-soon': isDueSoon(item) }" x-text="item.dueDate || '-'"></span>
                </td>
                <td>
                  <div class="status-badge" :style="'background: ' + item.status.color + '20; color: ' + item.status.color">
                    <span class="status-dot" :style="'background: ' + item.status.color"></span>
                    <span x-text="item.status.label"></span>
                  </div>
                </td>
                <td>
                  <template x-if="isScorableCategory(item.task.category_id)">
                    <span class="score-cell" :class="{ 'has-score': item.score }" x-text="item.score ? item.score + '/10' : '-'"></span>
                  </template>
                  <template x-if="!isScorableCategory(item.task.category_id)">
                    <span class="score-cell na">N/A</span>
                  </template>
                </td>
                <td>
                  <button class="btn-edit" @click="openEditModal(item)" title="Edit progress">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>

        <!-- Empty State -->
        <div class="empty-state" x-show="getFilteredTasks().length === 0">
          <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          <p class="empty-text" x-text="trainees.length === 0 ? 'No trainees found. Add trainees to start tracking.' : 'No tasks match the selected filters.'"></p>
        </div>
      </div>
    </main>

    <!-- Edit Task Progress Modal -->
    <div class="modal-overlay" x-show="showEditModal" x-cloak @click.self="showEditModal = false">
      <div class="modal-content" @click.stop>
        <div class="modal-header">
          <h2 class="modal-title">Edit Task Progress</h2>
          <button class="modal-close" @click="showEditModal = false">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <template x-if="editingItem">
          <div>
            <!-- Task Info -->
            <div class="form-info">
              <div class="form-info-row">
                <span class="form-info-label">Trainee</span>
                <span class="form-info-value" x-text="editingItem.trainee.name"></span>
              </div>
              <div class="form-info-row">
                <span class="form-info-label">Task</span>
                <span class="form-info-value" x-text="editingItem.task.title"></span>
              </div>
              <div class="form-info-row">
                <span class="form-info-label">Week</span>
                <span class="form-info-value" x-text="'Week ' + editingItem.weekNumber"></span>
              </div>
            </div>

            <!-- Status Selection -->
            <div class="form-group">
              <label class="form-label">Status</label>
              <div class="status-select">
                <template x-for="status in statuses" :key="status.id">
                  <label class="status-option" :class="{ 'selected': editForm.status_id == status.id }">
                    <input type="radio" name="status" :value="status.id" x-model="editForm.status_id">
                    <span class="status-dot" :style="'background: ' + status.color"></span>
                    <span x-text="status.label"></span>
                  </label>
                </template>
              </div>
            </div>

            <!-- Score Section (only for exercise/project categories) -->
            <div class="score-section" x-show="isScorableCategory(editingItem.task.category_id)">
              <div class="score-section-title">Score (1-10)</div>
              <div class="score-input">
                <input type="range" class="score-range" min="1" max="10" step="1" x-model="editForm.score">
                <span class="score-value" x-text="editForm.score ? editForm.score + '/10' : '-'"></span>
              </div>
            </div>

            <!-- Planned Dates -->
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-input" x-model="editForm.start_date">
              </div>
              <div class="form-group">
                <label class="form-label">Due Date</label>
                <input type="date" class="form-input" x-model="editForm.due_date">
              </div>
            </div>

            <!-- Actual Dates (read-only) -->
            <div class="form-info" x-show="editingItem.startedAt || editingItem.completedAt">
              <div class="form-info-row" x-show="editingItem.startedAt">
                <span class="form-info-label">Actually Started</span>
                <span class="form-info-value" x-text="formatDateTime(editingItem.startedAt)"></span>
              </div>
              <div class="form-info-row" x-show="editingItem.completedAt">
                <span class="form-info-label">Actually Completed</span>
                <span class="form-info-value" x-text="formatDateTime(editingItem.completedAt)"></span>
              </div>
            </div>

            <div class="modal-actions">
              <button type="button" class="btn-secondary" @click="showEditModal = false">Cancel</button>
              <button type="button" class="btn-primary" @click="saveProgress">Save</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</body>
</html>
